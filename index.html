
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoCat IA | Sistema Multiagente</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #12345a;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .agents {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .agent {
      flex: 1;
      background: white;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #dce3ec;
    }

    .chat {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #dce3ec;
    }

    #messages {
      height: 380px;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #dbeafe;
      margin-left: 15%;
    }

    .assistant {
      background: #f1f5f9;
      margin-right: 15%;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e2e8f0;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    button {
      background: #12345a;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
    }

    button:hover { background: #21558b; }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 20px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .agents { flex-direction: column; }
      form { flex-direction: column; }
      .user, .assistant { margin: 0 0 14px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>GeoCat IA</h1>
    <p>Sistema Multiagente de Catastro y Geodesia</p>
  </header>

  <main>
    <section class="agents">
      <div class="agent">
        <h3>Catastro</h3>
        <p>Zonas homogéneas, avalúos y gestión catastral.</p>
      </div>
      <div class="agent">
        <h3>Geodesia</h3>
        <p>MAGNA-SIRGAS, coordenadas y sistemas de referencia.</p>
      </div>
    </section>

    <section class="chat">
      <div id="messages" aria-live="polite">
        <div class="message assistant">
          Bienvenido a GeoCat IA.

          Escribe una pregunta sobre Catastro o Geodesia.
        </div>
      </div>

      <form id="chatForm">
        <input
          id="question"
          type="text"
          placeholder="Escribe tu pregunta..."
          maxlength="1000"
          required
        >
        <button id="sendButton" type="submit">
          Enviar
        </button>
      </form>
    </section>
  </main>

  <footer>
    GeoCat IA | Proyecto académico
  </footer>

  <script>
    const form = document.getElementById("chatForm");
    const input = document.getElementById("question");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const element = document.createElement("div");
      element.className = "message " + type;
      element.textContent = text;
      messages.appendChild(element);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      addMessage(
        "La interfaz está funcionando. " +
        "Todavía falta conectar el servidor Python " +
        "para generar respuestas reales.",
        "assistant"
      );
    });
  </script>
</body>
</html>
